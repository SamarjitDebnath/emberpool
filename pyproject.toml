[project]
name = "emberpool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.29.0",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".worktrees", ".git", ".venv", "build", "dist"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "vm: needs root, KVM or the dev VM; skipped when unavailable",
]
